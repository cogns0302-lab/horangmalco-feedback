{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block body %}
<div class="card auth">
  <h1>로그인</h1>
  <p class="muted">승인된 크루만 사용할 수 있는 비공개 도구입니다.</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>아이디<input name="email" required autocomplete="username" autocapitalize="none" autofocus></label>
    <label>비밀번호<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn primary wide">로그인</button>
  </form>
  <p class="muted center">크루로 처음 오셨나요? <a href="/signup">크루 가입</a></p>
</div>
{% endblock %}
