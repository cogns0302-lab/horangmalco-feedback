{% extends "base.html" %}
{% block title %}크루 가입{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block body %}
<div class="card auth">
  <h1>크루 가입</h1>
  <p class="muted">가입 후 관리자가 승인하면 로그인할 수 있습니다. 학교급에 맞는 수험생이 순번대로 배정됩니다.</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/signup">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>학교급
      <select name="level" required>
        <option value="">선택하세요</option>
        {% for lv in levels %}<option value="{{ lv }}" {% if form.level == lv %}selected{% endif %}>{{ lv }}</option>{% endfor %}
      </select>
    </label>
    <label>이름<input name="name" required maxlength="40" value="{{ form.name or '' }}"></label>
    <label>닉네임 <small>화면과 담당자 칸에 표시됩니다</small><input name="nickname" required maxlength="40" value="{{ form.nickname or '' }}"></label>
    <label>아이디 <small>영문 소문자·숫자 3자 이상</small><input name="email" required minlength="3" maxlength="60" autocomplete="username" autocapitalize="none" value="{{ form.email or '' }}"></label>
    <label>비밀번호 <small>8자 이상</small><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <fieldset class="plain-set">
      <legend>정산 계좌 <small>관리자만 볼 수 있습니다</small></legend>
      <label>은행<input name="bank" required maxlength="30" placeholder="예: 국민은행" value="{{ form.bank or '' }}"></label>
      <label>계좌번호 <small>숫자와 - 만</small><input name="account_no" required maxlength="30" inputmode="numeric" autocomplete="off" value="{{ form.account_no or '' }}"></label>
      <label>예금주<input name="account_holder" required maxlength="40" value="{{ form.account_holder or '' }}"></label>
    </fieldset>
    <button class="btn primary wide">가입 신청</button>
  </form>
  <p class="muted center"><a href="/login">로그인으로 돌아가기</a></p>
</div>
{% endblock %}
