{% extends "base.html" %}
{% block title %}사용 신청{% endblock %}
{% block main_class %}narrow{% endblock %}
{% block body %}
<div class="card auth">
  <h1>사용 신청</h1>
  <p class="muted">신청 후 관리자가 승인하면 로그인할 수 있습니다.</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/signup">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>이름<input name="name" required maxlength="40" autofocus></label>
    <label>이메일<input type="email" name="email" required autocomplete="username"></label>
    <label>비밀번호 <small>8자 이상</small><input type="password" name="password" required minlength="8" autocomplete="new-password"></label>
    <button class="btn primary wide">신청하기</button>
  </form>
  <p class="muted center"><a href="/login">로그인으로 돌아가기</a></p>
</div>
{% endblock %}
