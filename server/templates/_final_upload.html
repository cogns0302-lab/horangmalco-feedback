{# 완성본 올리기: examinee_id / job_id 가 있으면 학교급·제목이 자동으로 정해진다. #}
<form class="card inline-form final-up" method="post" action="/finals" enctype="multipart/form-data">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% if final_examinee %}<input type="hidden" name="examinee_id" value="{{ final_examinee }}">{% endif %}
  {% if final_job %}<input type="hidden" name="job_id" value="{{ final_job }}">{% endif %}
  <input type="hidden" name="back" value="{{ final_back or '/finals' }}">
  {% if not final_examinee and not final_job %}
  <label class="narrow">학교급<select name="level" required>{% for lv in levels %}<option value="{{ lv }}" {% if lv == (final_level or user.level) %}selected{% endif %}>{{ lv }}</option>{% endfor %}</select></label>
  {% endif %}
  <label class="grow">제목 <small>드라이브 파일 이름이 됩니다</small><input name="title" maxlength="120" value="{{ final_title }}" placeholder="예: 서울유특홍길동T - 24년 평가원 피드백"></label>
  <label class="grow">완성본 파일 <small>hwp · hwpx · pdf · docx</small><input type="file" name="file" required accept=".hwp,.hwpx,.pdf,.docx,.doc"></label>
  <button class="btn primary">완성본 올리기</button>
</form>
